[project]
name = "hello-agents"
version = "2026.9.0"
description = "Agent concepts playground"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiohttp>=3.14.5",
  "any-llm-sdk[all]>=1.37.0",
  "bub>=0.5.1",
  "cryptography>=50.0.2",
  "google-search-results>=2.4.2",
  "langchain>=1.4.6",
  "langchain-community>=0.4.2",
  "langchain-openai>=1.7.2",
  "langgraph>=1.2.16",
  "litellm>=1.106.0",
  "nest-asyncio>=1.6.0",
  "pydantic>=2.14.1",
  "republic>=0.6.0",
  "smolagents[toolkit]>=1.26.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ulib"]

[tool.pyrefly]
project-includes = [
  "**/*.py",
  "**/*.ipynb",
]

[tool.uv]
python-preference = "managed"
prerelease = "if-necessary"
resolution = "highest"
