[project]
name = "hello-agents"
version = "2026.10.0"
description = "Agent concepts playground"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiohttp>=3.14.5",
  "any-llm-sdk[all]>=1.47.0",
  "bub>=0.6.1",
  "cryptography>=50.0.2",
  "google-search-results>=2.4.2",
  "litellm>=1.110.0.dev2",
  "nest-asyncio>=1.6.0",
  "republic>=0.6.1",
  "smolagents[toolkit]>=1.26.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.4",
  "ty>=0.0.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ulib"]

[tool.pyrefly]
project-includes = [
  "**/*.py",
  "**/*.ipynb",
]

[tool.uv]
python-preference = "managed"
prerelease = "if-necessary"
resolution = "highest"
