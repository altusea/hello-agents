[project]
name = "hello-agents"
version = "2026.9.0"
description = "Agent concepts playground"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiohttp>=3.14.3",
  "any-llm-sdk[all]>=1.29.0",
  "bub>=0.4.4",
  "cryptography>=50.0.1",
  "google-search-results>=2.4.2",
  "langchain>=1.4.3",
  "langchain-community>=0.4.2",
  "langchain-openai>=1.6.7",
  "langgraph>=1.2.12",
  "litellm>=1.103.2",
  "nest-asyncio>=1.6.0",
  "pydantic>=2.13.5",
  "republic>=0.5.8",
  "smolagents[toolkit]>=1.26.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ulib"]

[tool.pyrefly]
project-includes = [
  "**/*.py",
  "**/*.ipynb",
]

[tool.uv]
python-preference = "managed"
prerelease = "if-necessary"
resolution = "highest"
